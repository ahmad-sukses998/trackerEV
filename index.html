<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eatventure Progress Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 md:p-8">
  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl p-6 space-y-6">
    
    <h1 class="text-2xl font-bold text-center text-slate-900 border-b pb-4">🍳 Eatventure Tracker</h1>

    <!-- SECTION 1: JANGKAR TARGET -->
    <div class="bg-amber-50 rounded-xl p-4 border border-amber-200">
      <h2 class="text-sm font-bold text-amber-800 uppercase tracking-wide mb-3 flex justify-between items-center">
        <span>🎯 Jangkar Target Total</span>
        <span class="text-[10px] bg-amber-200 text-amber-800 px-2 py-1 rounded-full">Bisa Diedit ✏️</span>
      </h2>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-white p-2 rounded-lg shadow-sm flex flex-col items-center">
          <label for="inputTargetKota" class="block text-xs text-slate-500 mb-1 cursor-pointer">Target Kota</label>
          <input type="number" id="inputTargetKota" oninput="simpanTarget()" class="w-full text-center font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded p-1 focus:ring-2 focus:ring-amber-500 outline-none transition">
        </div>
        <div class="bg-white p-2 rounded-lg shadow-sm flex flex-col items-center">
          <label for="inputTargetGems" class="block text-xs text-slate-500 mb-1 cursor-pointer">Target Gems</label>
          <input type="number" id="inputTargetGems" oninput="simpanTarget()" class="w-full text-center font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded p-1 focus:ring-2 focus:ring-amber-500 outline-none transition">
        </div>
        <div class="bg-white p-2 rounded-lg shadow-sm flex flex-col items-center">
          <label for="inputTargetKotak" class="block text-xs text-slate-500 mb-1 cursor-pointer">Target Kotak</label>
          <input type="number" id="inputTargetKotak" oninput="simpanTarget()" class="w-full text-center font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded p-1 focus:ring-2 focus:ring-amber-500 outline-none transition">
        </div>
      </div>
    </div>

    <!-- SECTION 2: INPUT CHAT PROGRES -->
    <div class="space-y-3">
      <label for="chatInput" class="block text-sm font-semibold text-slate-700">💬 Kirim Chat Progres</label>
      <input type="text" id="chatInput" onkeydown="handleKeyPress(event)" placeholder="Contoh: kota 1043 dengan gem 4360 dan kotak 451" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
      <button onclick="prosesChat()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition">🚀 Kirim Chat Progres</button>
      
      <!-- BOX AKUMULASI CARRY OVER (HUTANG / SURPLUS) -->
      <div id="carryOverBox" class="mt-4 p-4 border rounded-xl text-center space-y-2 transition-all">
        <span id="statusTitle" class="text-xs font-semibold uppercase tracking-wider block">Akumulasi Status</span>
        <div id="carryOverVal" class="text-4xl font-extrabold">0</div>
        <div>
          <span id="statusBadge" class="inline-block px-3 py-1 rounded-full text-xs font-bold text-white mt-1">Status</span>
        </div>
        <p id="statusDesc" class="text-sm font-medium italic pt-1"></p>
      </div>

      <!-- BOX PENGINGAT HARIAN & ISTIRAHAT -->
      <div class="mt-3 p-4 bg-blue-50 border border-blue-200 rounded-xl text-sm">
        <div class="font-bold text-blue-800 mb-1">📢 Rekap & Pengingat</div>
        <div id="reminderTarget" class="text-blue-700 mb-1"></div>
        <div id="reminderRest" class="font-bold text-indigo-700"></div>
      </div>
    </div>

    <!-- SECTION 3: RINGKASAN PROGRES UTAMA -->
    <div class="space-y-3 pt-2">
      <div>
        <div class="flex justify-between text-xs font-bold mb-1">
          <span>Progres Target Kota</span>
          <span id="txtProgresKota">0/1300 (0%)</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-3">
          <div id="barProgresKota" class="bg-emerald-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
      <div>
        <div class="flex justify-between text-xs font-bold mb-1">
          <span>Progres Target Gems</span>
          <span id="txtProgresGems">0/50000 (0%)</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-3">
          <div id="barProgresGems" class="bg-blue-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
      <div>
        <div class="flex justify-between text-xs font-bold mb-1">
          <span>Progres Target Kotak Kecil</span>
          <span id="txtProgresKotak">0/4500 (0%)</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-3">
          <div id="barProgresKotak" class="bg-amber-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- SECTION 4: RIWAYAT CHAT -->
    <div class="pt-4 border-t border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-md font-bold text-slate-800">📜 RIWAYAT BALASAN CHAT</h2>
        <button onclick="hapusRiwayat()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 text-xs font-bold rounded-lg transition">Hapus Semua</button>
      </div>
      <div id="riwayatContainer" class="space-y-3 max-h-96 overflow-y-auto pr-2"></div>
    </div>

  </div>

  <script>
    // === KONFIGURASI ===
    const TARGET_HARIAN = 22;
    const KOTA_AWAL = 1017;
    const HUTANG_AWAL = 18; 

    // === LOCALSTORAGE TARGET ===
    let targetData = JSON.parse(localStorage.getItem("eatventure_targets")) || {
        kota: 1300,
        gems: 50000,
        kotak: 4500
    };

    document.getElementById("inputTargetKota").value = targetData.kota;
    document.getElementById("inputTargetGems").value = targetData.gems;
    document.getElementById("inputTargetKotak").value = targetData.kotak;

    function simpanTarget() {
        targetData.kota = parseInt(document.getElementById("inputTargetKota").value) || 0;
        targetData.gems = parseInt(document.getElementById("inputTargetGems").value) || 0;
        targetData.kotak = parseInt(document.getElementById("inputTargetKotak").value) || 0;
        
        localStorage.setItem("eatventure_targets", JSON.stringify(targetData));
        renderUI();
    }

    // === LOCALSTORAGE RIWAYAT ===
    // Default data diperbarui dengan histori terakhir hari ini jam 16.31 agar HP tersinkronisasi
    const defaultData = [
      { tgl: "6/10/2026 16.31", kota: 1043, gem: 27600, kotak: 0, raw: "saya di kota 1043 dengan kotak 0 dan gem 27600" },
      { tgl: "6/10/2026 04.40", kota: 1043, gem: 4360, kotak: 451, raw: "kota 1043 dengan gem 4360 dan kotak 451" },
      { tgl: "6/10/2026 03.37", kota: 1039, gem: 3710, kotak: 387, raw: "kota 1039 dengan gem 3710 dan kotak 387" },
      { tgl: "6/10/2026 02.55", kota: 1034, gem: 2850, kotak: 303, raw: "aku di kota 1034 dengan gem 2850 dan kotak 303" },
      { tgl: "5/10/2026 17.06", kota: 1027, gem: 5450, kotak: 168, raw: "kota 1027 dengan gem 5450 dan kotak 168" },
      { tgl: "5/10/2026 14.54", kota: 1025, gem: 5821, kotak: 132, raw: "kota 1025 dengan gem 5821 dan kotak 132" },
      { tgl: "5/10/2026 01.01", kota: 1017, gem: 3990, kotak: 0, raw: "saya di kota 1017 dengan gem 3990 dan kotak 0" }
    ];

    let riwayat = JSON.parse(localStorage.getItem("eatventure_tw_riwayat"));
    if (!riwayat || riwayat.length === 0) {
        riwayat = defaultData;
        localStorage.setItem("eatventure_tw_riwayat", JSON.stringify(riwayat));
    }

    // Fungsi tangkap tombol Enter
    function handleKeyPress(e) {
      if (e.key === "Enter") {
        prosesChat();
      }
    }

    function prosesChat() {
      const input = document.getElementById("chatInput").value;
      if (!input.trim()) return;

      const kotaMatch = input.match(/kota\s*(\d+)/i);
      const gemMatch = input.match(/gem[s]?\s*(\d+)/i);
      const kotakMatch = input.match(/kotak\s*(\d+)/i);

      if (!kotaMatch) {
        alert("Format chat kurang pas! Masukkan minimal angka kota (contoh: kota 1040).");
        return;
      }

      const now = new Date();
      const tglStr = `${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}.${String(now.getMinutes()).padStart(2,'0')}`;

      const lastData = riwayat[0] || { kota: KOTA_AWAL, gem: 0, kotak: 0 };
      const newKota = kotaMatch ? parseInt(kotaMatch[1]) : lastData.kota;
      const newGem = gemMatch ? parseInt(gemMatch[1]) : lastData.gem;
      const newKotak = kotakMatch ? parseInt(kotakMatch[1]) : lastData.kotak;

      riwayat.unshift({
        tgl: tglStr,
        kota: newKota,
        gem: newGem,
        kotak: newKotak,
        raw: input
      });

      localStorage.setItem("eatventure_tw_riwayat", JSON.stringify(riwayat));
      document.getElementById("chatInput").value = "";
      renderUI();
    }

    // Fungsi Hapus Pesan Individu
    function hapusPesan(index) {
      riwayat.splice(index, 1);
      localStorage.setItem("eatventure_tw_riwayat", JSON.stringify(riwayat));
      renderUI();
    }

    function hitungStatusProgres() {
      // Set target kumulatif langsung ke 18 kota untuk penyesuaian saat ini (mulai dari hutang 18)
      const targetKumulatif = 18;
      const totalKotaSaatIni = riwayat.length > 0 ? riwayat[0].kota : KOTA_AWAL;
      
      // Mengambil progres kota sejak input terakhir hari ini (1043)
      const kotaDiselesaikan = totalKotaSaatIni - 1043;

      return kotaDiselesaikan - targetKumulatif;
    }

    function renderUI() {
      const latest = riwayat[0] || { kota: KOTA_AWAL, gem: 0, kotak: 0 };

      // 1. UPDATE PROGRESS BAR
      const pctKota = targetData.kota > 0 ? Math.min(100, Math.round((latest.kota / targetData.kota) * 100)) : 0;
      const pctGems = targetData.gems > 0 ? Math.min(100, Math.round((latest.gem / targetData.gems) * 100)) : 0;
      const pctKotak = targetData.kotak > 0 ? Math.min(100, Math.round((latest.kotak / targetData.kotak) * 100)) : 0;

      document.getElementById("txtProgresKota").innerText = `${latest.kota}/${targetData.kota} (${pctKota}%)`;
      document.getElementById("barProgresKota").style.width = `${pctKota}%`;

      document.getElementById("txtProgresGems").innerText = `${latest.gem}/${targetData.gems} (${pctGems}%)`;
      document.getElementById("barProgresGems").style.width = `${pctGems}%`;

      document.getElementById("txtProgresKotak").innerText = `${latest.kotak}/${targetData.kotak} (${pctKotak}%)`;
      document.getElementById("barProgresKotak").style.width = `${pctKotak}%`;

      // 2. UPDATE CARRY OVER / STATUS
      const selisih = hitungStatusProgres();
      const box = document.getElementById("carryOverBox");
      const title = document.getElementById("statusTitle");
      const val = document.getElementById("carryOverVal");
      const badge = document.getElementById("statusBadge");
      const desc = document.getElementById("statusDesc");

      box.className = "mt-4 p-4 border rounded-xl text-center space-y-1 transition-all";

      if (selisih < 0) {
        const hutang = Math.abs(selisih);
        box.classList.add("bg-red-50", "border-red-200");
        title.className = "text-xs font-semibold uppercase tracking-wider text-red-700 block";
        title.innerText = "Akumulasi Hutang Target Kota";
        val.innerHTML = `${hutang} <span class="text-base font-normal">Kota</span>`;
        val.className = "text-4xl font-extrabold text-red-600";
        desc.className = "text-sm font-medium text-red-800 italic pt-2";

        if (hutang > 15) {
            badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-red-500 text-white mt-1";
            badge.innerText = "Rank: Ksatria Tertinggal ⚠️";
            desc.innerText = "Hutang lumayan menumpuk. Yuk pelan-pelan kejar target harianmu!";
        } else {
            badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-orange-500 text-white mt-1";
            badge.innerText = "Rank: Pengejar Target 🏃";
            desc.innerText = "Sedikit lagi mendekati target. Kamu pasti bisa melunasinya!";
        }
      } else {
        box.classList.add("bg-emerald-50", "border-emerald-200");
        title.className = "text-xs font-semibold uppercase tracking-wider text-emerald-800 block";
        title.innerText = "SURPLUS / TABUNGAN KOTA";
        val.innerHTML = `+${selisih} <span class="text-base font-normal text-emerald-700">Kota 🔥</span>`;
        val.className = "text-4xl font-extrabold text-emerald-600";
        desc.className = "text-sm font-medium text-emerald-800 italic pt-2";

        if (selisih === 0) {
            badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-emerald-600 text-white mt-1";
            badge.innerText = "Rank: Pemain Konsisten 🎯";
            desc.innerText = "Target terpenuhi pas! Pertahankan ritme permainanmu.";
        } else if (selisih <= 10) {
            badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-blue-500 text-white mt-1";
            badge.innerText = "Rank: Pejuang Progres 🚀";
            desc.innerText = "Luar biasa! Kamu punya tabungan kota jika besok ingin santai.";
        } else {
            badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-purple-600 text-white mt-1";
            badge.innerText = "Rank: Master Grind 👑";
            desc.innerText = "Sangat luar biasa! Progres kamu jauh melampaui target harian.";
        }
      }

      // 3. PENGINGAT HARIAN & ISTIRAHAT
      document.getElementById("reminderTarget").innerHTML = `Target kamu adalah <b>${TARGET_HARIAN} kota per hari</b>.`;
      
      const jamSekarang = new Date().getHours();
      const restEl = document.getElementById("reminderRest");
      if (jamSekarang >= 23 || jamSekarang < 5) {
          restEl.innerText = "🌙 Sudah larut malam/dini hari! Waktunya istirahat & tidur.";
      } else if (jamSekarang >= 12 && jamSekarang <= 13) {
          restEl.innerText = "🍱 Waktunya makan siang. Rehat sejenak dari layar hpmu!";
      } else {
          restEl.innerText = "☕ Ingat untuk peregangan mata dan badan berkala saat main!";
      }

      // 4. RENDER RIWAYAT DENGAN TOMBOL HAPUS INDIVIDU
      const container = document.getElementById("riwayatContainer");
      container.innerHTML = "";

      riwayat.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2 text-xs hover:bg-slate-100 transition relative group";
        card.innerHTML = `
          <div class="flex justify-between items-center font-bold text-slate-500">
            <span>📅 ${item.tgl}</span>
            <button onclick="hapusPesan(${index})" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-2 py-0.5 rounded text-[10px] transition" title="Hapus pesan ini">
              🗑️ Hapus
            </button>
          </div>
          <div class="text-slate-800 font-medium">💬 <i>"${item.raw}"</i></div>
          <div class="bg-white p-2 rounded border border-slate-100 text-slate-700">
            🤖 <b>Balasan:</b> Progres diperbarui!<br>
            <div class="mt-1 flex gap-2 flex-wrap">
              <span class="bg-slate-100 px-2 py-1 rounded">🏙️ ${item.kota}/${targetData.kota}</span>
              <span class="bg-slate-100 px-2 py-1 rounded">💎 ${item.gem}/${targetData.gems}</span>
              <span class="bg-slate-100 px-2 py-1 rounded">📦 ${item.kotak}/${targetData.kotak}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function hapusRiwayat() {
      if (confirm("Yakin ingin menghapus seluruh riwayat chat? Target dan hutang akan direset kembali ke awal.")) {
        riwayat = [];
        localStorage.removeItem("eatventure_tw_riwayat");
        renderUI();
      }
    }

    renderUI();
    setInterval(renderUI, 60000);
  </script>
</body>
</html>

```
